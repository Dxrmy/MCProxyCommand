plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'com.modrinth.minotaur' version '2.+'
}

// Fabric Properties. Check these on https://modmuss50.me/fabric.html
def minecraft_version='26.2'

def loader_version='0.16.0'

def fabric_version='0.101.0+26.2'

repositories {
    // NOTE This should currently be not needed, but to fiddle around with this dependency issue
    //      we keep this for now
    maven {
        url = 'https://api.modrinth.com/maven'
    }
}

loom.noIntermediateMappings()

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly files('/mnt/nvme0n1p2/bl/minecraft/network/hub/versions/26.2/server-26.2.jar')
    compileOnly fileTree(dir: '/mnt/nvme0n1p2/bl/minecraft/network/hub/libraries', include: '**/*.jar')
    compileOnly fileTree(dir: '/mnt/nvme0n1p2/bl/minecraft/network/hub/.fabric/processedMods', include: '*.jar')
    compileOnly fileTree(dir: '/mnt/nvme0n1p2/bl/minecraft/network/hub/fabric/.fabric/processedMods', include: '*.jar')
    compileOnly files('/mnt/nvme0n1p2/bl/minecraft/network/hub/mods/FabricProxy-Lite.jar')
    implementation "net.fabricmc:fabric-loader:${loader_version}"

    implementation project(':common')
    include project(':common')
}

modrinth {
    projectId = 'proxy-command-reloaded'
    versionNumber = project.version
    versionType = project.version.contains('SNAPSHOT') ? 'alpha' : 'release'
    gameVersions = ['1.21']
    loaders = ['fabric']
    dependencies {
        required.project 'fabric-api'
        required.project 'fabricproxy-lite'
    }
    uploadFile = jar
    syncBodyFrom = rootProject.file("README.md").text

    // Use the environment variable `$MODRINTH_TOKEN` for the token
    // token = 'mySecretToken'
}
tasks.modrinth.dependsOn(tasks.modrinthSyncBody)

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

base {
    archivesName = "$rootProject.name-fabric"
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

tasks.runServer.workingDir = 'run'

